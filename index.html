<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pong Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game-wrapper">
    <h1>Pong</h1>
    <section class="scoreboard" aria-label="Scoreboard">
      <div><span class="label">Player</span><span id="player-score">0</span></div>
      <div class="separator">:</div>
      <div><span class="label">Computer</span><span id="computer-score">0</span></div>
    </section>
    <canvas id="game-canvas" width="900" height="500" aria-label="Pong game"></canvas>
    <p class="instructions">Move with your mouse or the <kbd>↑</kbd> <kbd>↓</kbd> arrow keys. Press <kbd>Space</kbd> to pause.</p>
    <button id="restart-button" type="button">Restart Game</button>
  </main>
  <script src="script.js"></script>
</body>
</html>
